paths:
  root: .
  porems_models_dir: data/mesoporous_silica/pore_models
  silica_patches_dir: data/mesoporous_silica/surface_patches
  surface_sites_dir: data/mesoporous_silica/surface_sites
  aimd_local_structures_dir: data/cp2k_aimd/seed_structures
  full_pore_seed_structures_dir: data/mlff_seed/structures
  aimd_exports_dir: data/exports
  aimd_seed_manifest: data/exports/aimd_seed_manifest.csv
  aimd_structure_manifest: data/exports/all_data_generation_manifest.csv
  aimd_local_manifest: data/cp2k_aimd/seed_structures/aimd_local_manifest.csv
  cp2k_structure_input_manifest: data/exports/cp2k_structure_input_manifest.csv
  cp2k_jobs_dir: data/cp2k_aimd/jobs
  cp2k_parsed_dir: data/cp2k_aimd/parsed
  aimd_dataset_dir: data/aimd_dataset
  exports_dir: data/exports
  logs_dir: outputs/logs
  jobs_dir: outputs/jobs
  figures_dir: outputs/figures
run:
  run_id: pilot_20260706_closed_small_ps_anchors
  clean_start: true
tools:
  porems_search_roots: [., ~/software, ~]
  porems_path_hint:
  known_emc_root: ~/software/EMC
  known_openbabel_executable: /public/home/jinhao.hu/.conda/envs/peppmixure/bin/obabel
  packmol_executable: /public/home/jinhao.hu/.conda/envs/peppmixure/bin/packmol
  ase_required: true
  cp2k_not_required_here: false
  mlff_not_required_here: true
dataset_scope:
  elements: [C, H, O, Si]
  forbid_metals: true
  forbid_ru: true
  allow_only_real_cp2k_outputs: true
  forbid_fake_energy_forces: true
porems:
  enabled: true
  model_type: silica_pore
  pore_shape: cylindrical
  surface: hydroxylated_silica
  require_explicit_surface_H: true
  require_no_dangling_bonds: true
  pore_diameter_nm_candidates: [4.0]
  pore_length_nm_candidates: [4.0]
  hydroxylation_modes: [silanol_rich]
  max_pore_models_tiny: 1
  max_pore_models_pilot: 1
  max_pore_models_main: 1
silica_patch:
  rebuild_local_cell: true
  vacuum_buffer_A: 6.0
  min_surface_oh_count_for_silanol_rich: 2
mlff_assumptions:
  planned_mlff_cutoff_A: 5.0
  min_cell_multiple_of_cutoff: 2.0
  min_cell_length_A: 24.0
closed_small_anchors:
  patch_radius_A: 7.5
  max_silica_atoms_before_capping: 90
  cell_margin_A: 8.0
  emc_chain_length_backbone: 32
  # Packmol keeps the silica cluster fixed and places polymer fragments in a box
  # above the capped silica surface. These are generation parameters, not
  # post-generation rejection rules.
  packmol_tolerance_A: 1.85
  packmol_maxit: 5000
  packmol_timeout_seconds: 300
  packmol_lateral_padding_A: 4.0
  packmol_surface_gap_A: 2.2
  packmol_surface_layer_thickness_A: 10.0
  tiny_max_structures: 9
  pilot_max_structures: 9
  main_max_structures: 9
emc:
  enabled: true
  force_field: pcff
  attempt_timeout_seconds: 300
  build_timeout_seconds: 900
density:
  initial_packing_density_g_cm3: 0.85
cp2k:
  project_prefix: peppps_chosi_closed_small_anchor
  method: PBE_D3_BJ
  run_types: [ENERGY_FORCE, MD]
  xc_functional: PBE
  dispersion: D3_BJ
  basis_set_file: BASIS_MOLOPT
  potential_file: GTH_POTENTIALS
  dftd3_file: dftd3.dat
  basis_set: DZVP-MOLOPT-SR-GTH
  potential: GTH-PBE
  periodic: XYZ
  charge: 0
  multiplicity: 1
  cutoff_Ry: 400
  rel_cutoff_Ry: 50
  eps_scf: 1.0e-4
  max_scf: 300
  scf_solver: OT
  outer_scf_max: 8
  ot_preconditioner: FULL_SINGLE_INVERSE
  ot_minimizer: DIIS
  ot_stepsize: 0.08
  ot_energy_gap: 0.001
  scf_mixing: BROYDEN_MIXING
  added_mos: 100
  electronic_smearing_K: 300
  temperatures_K: [523.0]
label_modes:
  single_point_force:
    cp2k_run_type: ENERGY_FORCE
  short_nvt_aimd:
    cp2k_run_type: MD
    ensemble: NVT
    timestep_fs: 0.25
    steps_tiny: 100
    steps_main: 200
    frame_stride: 5
    eps_scf: 1.0e-4
    max_scf: 100
    outer_scf_max: 5
    thermostat_type: CSVR
    thermostat_timecon_fs: 30.0
hpc:
  scheduler: slurm
  cp2k_module_placeholder: "cp2k-2024.1"
  cp2k_command_default: cp2k.psmp
  account:
  partition: batch
  nodes: 1
  ntasks_per_node: 32
  cpus_per_task: 1
  time_sp:
  time_aimd:
  sp_array_throttle: 8
  aimd_array_throttle: 4
dataset:
  dataset_id: peppps_silica_closed_small_anchor_cp2k
  output_format: extxyz
  split_strategy: family_blocked
  accepted_source_stages: [closed_hydrogen_capped_small_anchor]
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  require_energy: true
  require_forces: true
  optional_stress: true
  min_frames_for_training: 9
  tiny_max_structures: 9
  pilot_max_structures: 9
  main_max_structures: 9
units:
  output_energy: eV
  output_forces: eV_per_A
  cp2k_energy_hartree_to_eV: 27.211386245988
  cp2k_force_hartree_per_bohr_to_eV_per_A: 51.422067476
