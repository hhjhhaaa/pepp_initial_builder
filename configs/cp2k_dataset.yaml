paths:
  root: /home/jinhao/mlff/pepp_initial_builder
  aimd_structure_manifest: data/aimd_exports/pore_aimd_master_manifest.csv
  aimd_local_manifest: data/aimd_local_structures/aimd_local_manifest.csv
  cp2k_structure_input_manifest: data/aimd_exports/cp2k_structure_input_manifest.csv
  cp2k_jobs_dir: data/cp2k_seed_jobs
  cp2k_parsed_dir: data/cp2k_parsed
  aimd_dataset_dir: data/aimd_dataset
  exports_dir: data/exports
  logs_dir: outputs/logs
  jobs_dir: outputs/jobs
  lmp_proj_root: /home/jinhao/lmp-proj

reuse_lmp_proj:
  enabled: true
  wrap_reusable_modules: false
  fallback_to_internal_implementation: true
  strategy: review_and_reimplement_cleanly

dataset_scope:
  elements: [C, H, O, Si]
  forbid_metals: true
  forbid_ru: true
  allow_only_real_cp2k_outputs: true
  forbid_fake_energy_forces: true

cp2k:
  project_prefix: pepp_chosi_seed
  method: PBE_D3_BJ
  run_types: [ENERGY_FORCE, MD]
  xc_functional: PBE
  dispersion: D3_BJ
  basis_set_file: BASIS_MOLOPT
  potential_file: GTH_POTENTIALS
  dftd3_file: dftd3.dat
  basis_set: DZVP-MOLOPT-SR-GTH
  potential: GTH-PBE
  periodic: XYZ
  charge: 0
  multiplicity: 1
  cutoff_Ry: 400
  rel_cutoff_Ry: 50
  eps_scf: 1.0e-5
  max_scf: 100
  scf_mixing: BROYDEN
  electronic_smearing_K: 300
  temperatures_K: [523.0, 650.0]

label_modes:
  single_point_force:
    cp2k_run_type: ENERGY_FORCE
  short_nvt_aimd:
    cp2k_run_type: MD
    ensemble: NVT
    timestep_fs: 0.5
    steps_tiny: 100
    steps_main: 2000
    frame_stride: 20

hpc:
  scheduler: slurm
  cp2k_module_placeholder: "__SET_CP2K_MODULE_ON_HPC__"
  cp2k_command_default: cp2k.psmp
  account:
  partition:
  nodes: 1
  ntasks_per_node: 32
  cpus_per_task: 1
  time_sp: "04:00:00"
  time_aimd: "24:00:00"

dataset:
  dataset_id: pepp_silica_aimd_cp2k
  output_format: extxyz
  split_strategy: family_blocked
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  require_energy: true
  require_forces: true
  optional_stress: true
  min_frames_for_training: 10
  tiny_max_structures: 4
  pilot_max_structures: 40
  main_max_structures: 1000000
