paths:
  root: .
  bulk_initial_manifest: data/exports/polymer_initial_manifest.csv
  porems_models_dir: data/mesoporous_silica/pore_models
  silica_patches_dir: data/mesoporous_silica/surface_patches
  surface_sites_dir: data/mesoporous_silica/surface_sites
  aimd_local_structures_dir: data/cp2k_aimd/seed_structures
  full_pore_seed_structures_dir: data/mlff_seed/structures
  aimd_exports_dir: data/exports
  aimd_seed_manifest: data/exports/aimd_seed_manifest.csv
  aimd_structure_manifest: data/exports/all_data_generation_manifest.csv
  aimd_local_manifest: data/cp2k_aimd/seed_structures/aimd_local_manifest.csv
  cp2k_structure_input_manifest: data/exports/cp2k_structure_input_manifest.csv
  cp2k_jobs_dir: data/cp2k_aimd/jobs
  cp2k_parsed_dir: data/cp2k_aimd/parsed
  aimd_dataset_dir: data/aimd_dataset
  exports_dir: data/exports
  logs_dir: outputs/logs
  jobs_dir: outputs/jobs
  figures_dir: outputs/figures
  lmp_proj_root: ~/lmp-proj
run:
  run_id: pilot_20260703_fullpore_relaxed_cp2k
  clean_start: true
  forbid_reuse_existing_tiny_outputs: true
tools:
  porems_search_roots: [., ~/software, ~]
  porems_path_hint:
  packmol_path_hint:
  ase_required: true
  cp2k_not_required_here: false
  mlff_not_required_here: true
silica_patch:
  patch_types: [flat_like_wall_patch, concave_pore_wall_patch, silanol_rich_patch, siloxane_rich_patch]
  max_atoms_silica_patch: 100
  min_silica_atoms_for_valid_patch: 40
  min_surface_oh_count_for_silanol_rich: 2
  rebuild_local_cell: true
  vacuum_buffer_A: 5.0
  target_patch_radius_A: 8.0
  add_boundary_hydroxyls: true
  reject_dangling_si: true
  reject_dangling_o: true
mlff_assumptions:
  planned_mlff_cutoff_A: 5.0
  min_cell_multiple_of_cutoff: 2.0
  min_cell_length_A: 12.0
polymer_fragments:
  pe_backbone_lengths: [8, 12, 20]
  pp_backbone_lengths: [8, 12, 20]
  pp_tacticity: atactic_like_v0
  generate_hydrogen_by_valence: true
aimd_local_matrix:
  families:
    - PE_HDPE_CH2_silanol_contact
    - PE_branched_side_chain_silanol_contact
    - PP_methyl_silanol_contact
    - PP_methyl_siloxane_contact
    - PP_backbone_CH_silanol_contact
    - PE_PP_mixed_near_wall
    - crowded_polymer_wall_contact
    - silica_only_wall_baseline
  polymer_wall_distances_A: [2.5, 3.5, 5.0]
  polymer_orientations: [parallel, tilted, end_on, methyl_toward_wall, methyl_away_from_wall]
  temperatures_for_later_aimd_K: [523.0, 650.0]
  seeds: [1, 2, 3]
  max_atoms_per_aimd_structure: 300
  tiny_max_structures: 12
  pilot_max_structures: 60
  main_max_structures: 200
cp2k_crop:
  source_priority: [lammps_relaxed_full_pore, lammps_exploration_snapshot]
  tiny_max_atoms: 100
  pilot_max_atoms: 160
  main_max_atoms: 300
  tiny_crop_radius_A: 6.0
  pilot_crop_radius_A: 6.5
  main_crop_radius_A: 8.0
  require_full_pore_source: true
  patches_per_family_per_system: 3
  balanced_family_min_counts:
    PE_HDPE_CH2_silanol_contact: 3
    PP_methyl_silanol_contact: 1
    PP_methyl_siloxane_contact: 1
    PP_backbone_CH_silanol_contact: 1
    PE_PP_mixed_near_wall: 3
    crowded_polymer_wall_contact: 2
    silica_only_wall_baseline: 2
  require_snapshot_manifest: true
reuse_lmp_proj:
  enabled: true
  wrap_reusable_modules: false
  strategy: review_and_reimplement_cleanly
dataset_scope:
  elements: [C, H, O, Si]
  forbid_metals: true
  forbid_ru: true
  allow_only_real_cp2k_outputs: true
  forbid_fake_energy_forces: true
cp2k:
  project_prefix: pepp_chosi_seed
  method: PBE_D3_BJ
  run_types: [ENERGY_FORCE, MD]
  xc_functional: PBE
  dispersion: D3_BJ
  basis_set_file: BASIS_MOLOPT
  potential_file: GTH_POTENTIALS
  dftd3_file: dftd3.dat
  basis_set: DZVP-MOLOPT-SR-GTH
  potential: GTH-PBE
  periodic: XYZ
  charge: 0
  multiplicity: 1
  cutoff_Ry: 400
  rel_cutoff_Ry: 50
  eps_scf: 1.0e-5
  max_scf: 2000
  scf_solver: OT
  outer_scf_max: 20
  ot_preconditioner: FULL_ALL
  ot_minimizer: DIIS
  ot_stepsize: 0.08
  ot_energy_gap: 0.001
  scf_mixing: BROYDEN_MIXING
  added_mos: 100
  electronic_smearing_K: 300
  temperatures_K: [523.0, 650.0]
label_modes:
  single_point_force:
    cp2k_run_type: ENERGY_FORCE
  short_nvt_aimd:
    cp2k_run_type: MD
    ensemble: NVT
    timestep_fs: 0.5
    steps_tiny: 100
    steps_main: 2000
    frame_stride: 20
hpc:
  scheduler: slurm
  cp2k_module_placeholder: "cp2k-2024.1"
  cp2k_command_default: cp2k.psmp
  account:
  partition: batch
  nodes: 1
  ntasks_per_node: 32
  cpus_per_task: 1
  time_sp:
  time_aimd:
  sp_array_throttle: 10
  aimd_array_throttle: 4
dataset:
  dataset_id: pepp_silica_aimd_cp2k
  output_format: extxyz
  split_strategy: family_blocked
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  require_energy: true
  require_forces: true
  optional_stress: true
  min_frames_for_training: 10
  tiny_max_structures: 4
  pilot_max_structures: 40
  main_max_structures: 1000000
units:
  output_energy: eV
  output_forces: eV_per_A
  cp2k_energy_hartree_to_eV: 27.211386245988
  cp2k_force_hartree_per_bohr_to_eV_per_A: 51.422067476
