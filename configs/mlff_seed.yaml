paths:
  root: .
  bulk_initial_manifest: data/exports/polymer_initial_manifest.csv
  porems_models_dir: data/pore/porems_models
  silica_patches_dir: data/pore/silica_patches
  aimd_local_structures_dir: data/cp2k_aimd/seed_structures
  full_pore_seed_structures_dir: data/mlff_seed/structures
  aimd_exports_dir: data/exports
  logs_dir: outputs/logs
  figures_dir: outputs/figures
tools:
  porems_search_roots: [., ~/software, ~]
  porems_path_hint:
  packmol_path_hint:
  known_emc_root: ~/software/EMC
  known_openbabel_executable:
  ase_required: true
  cp2k_not_required_here: true
  mlff_not_required_here: true
chemistry:
  elements: [C, H, O, Si]
  include_metals: false
  include_ru: false
  include_reactions: false
  explicit_hydrogen: true
porems:
  enabled: true
  model_type: silica_pore
  pore_shape: cylindrical
  surface: hydroxylated_silica
  require_explicit_surface_H: true
  require_no_dangling_bonds: true
  pore_diameter_nm_candidates: [4.0, 6.0]
  pore_length_nm_candidates: [4.0, 6.0]
  hydroxylation_modes: [silanol_rich, siloxane_rich, mixed_oh]
  max_pore_models_tiny: 1
  max_pore_models_pilot: 3
  max_pore_models_main: 6
full_pore_seed_matrix:
  purpose: mlff_exploration_for_active_learning
  pore_diameter_nm: [4.0, 6.0]
  pore_length_nm: [4.0, 6.0]
  pe_pp_compositions: [[1.00, 0.00], [0.50, 0.50], [0.00, 1.00]]
  chain_lengths_backbone: [80]
  polymer_loading_modes: [low_loading, medium_loading]
  seeds: [1]
  tiny_max_systems: 3
  pilot_max_systems: 12
  main_max_systems: 60
  max_atoms_tiny: 20000
  max_atoms_pilot: 80000
  max_atoms_main: 150000
full_pore_seed:
  wall_buffer_A: 3.0
  end_buffer_A: 3.0
  max_initial_overlap_retries: 2000
  min_polymer_inside_pore_fraction: 0.95
  min_polymer_silica_distance_A: 1.6
lammps_full_pore_relax:
  enabled: true
  purpose: full_pore_pre_equilibration_before_cp2k_crop
  temperature_K: 523.0
  high_temperature_K: 650.0
  timestep_fs: 0.5
  tiny_high_temp_steps: 10000
  tiny_target_temp_steps: 10000
  pilot_high_temp_steps: 400000
  pilot_target_temp_steps: 1600000
  main_high_temp_steps: 2000000
  main_target_temp_steps: 8000000
  minimize_etol: 1.0e-6
  minimize_ftol: 1.0e-8
  minimize_maxiter: 5000
  minimize_maxeval: 20000
  thermo_every: 500
  dump_every: 1000
  timeout_seconds: 1800
  silica_mobile: false
  relax_is_training_data: false
  relax_is_production_md: false
packing:
  tolerance_A: 2.0
  maxit: 2000
  timeout_seconds: 300
  use_packmol_for_polymer_placement: true
  min_heavy_atom_distance_A: 1.8
  min_hydrogen_distance_A: 0.8
  nonbonded_overlap_only: true
  exclude_1_2_pairs: true
  exclude_1_3_pairs: true
  optionally_exclude_1_4_pairs: true
outputs:
  primary_format: extxyz
  secondary_formats: [pdb, xyz]
  write_cp2k_xyz: true
  write_metadata_yaml: true
  write_atom_table: true
  write_segment_table: true
  require_cell_pbc: true
emc:
  enabled: true
  force_field: pcff
  attempt_timeout_seconds: 300
  build_timeout_seconds: 900
