paths:
  root: /home/jinhao/mlff/pepp_initial_builder
  bulk_initial_manifest: /home/jinhao/mlff/pepp_initial_builder/data/exports/polymer_initial_manifest.csv
  porems_models_dir: data/pore/porems_models
  silica_patches_dir: data/pore/silica_patches
  aimd_local_structures_dir: data/cp2k_aimd/seed_structures
  full_pore_seed_structures_dir: data/mlff_seed/structures
  aimd_exports_dir: data/exports
  logs_dir: outputs/logs
  figures_dir: outputs/figures
tools:
  porems_search_roots:
    - /home/jinhao
    - /home/jinhao/software
    - /home/jinhao/mlff
  porems_path_hint: /home/jinhao/software/PoreMS
  packmol_path_hint: /home/jinhao/software/packmol/packmol-21.1.1/packmol
  ase_required: true
  cp2k_not_required_here: true
  mlff_not_required_here: true
chemistry:
  elements: [C, H, O, Si]
  include_metals: false
  include_ru: false
  include_reactions: false
  explicit_hydrogen: true
porems:
  enabled: true
  model_type: silica_pore
  pore_shape: cylindrical
  surface: hydroxylated_silica
  require_explicit_surface_H: true
  require_no_dangling_bonds: true
  pore_diameter_nm_candidates: [4.0, 6.0]
  pore_length_nm_candidates: [4.0, 6.0]
  hydroxylation_modes: [silanol_rich, siloxane_rich, mixed_oh]
  max_pore_models_tiny: 1
  max_pore_models_pilot: 3
  max_pore_models_main: 6
silica_patch:
  patch_types: [flat_like_wall_patch, concave_pore_wall_patch, silanol_rich_patch, siloxane_rich_patch]
  max_atoms_silica_patch: 100
  min_silica_atoms_for_valid_patch: 40
  min_surface_oh_count_for_silanol_rich: 2
  rebuild_local_cell: true
  vacuum_buffer_A: 5.0
  target_patch_radius_A: 8.0
  add_boundary_hydroxyls: true
  reject_dangling_si: true
  reject_dangling_o: true
mlff_assumptions:
  planned_mlff_cutoff_A: 5.0
  min_cell_multiple_of_cutoff: 2.0
  min_cell_length_A: 12.0
