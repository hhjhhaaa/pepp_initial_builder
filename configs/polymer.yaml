paths:
  root: .
  systems_dir: data/polymer/systems
  matrix_dir: data/polymer/matrix
  exports_dir: data/exports
  logs_dir: outputs/logs
matrix:
  compositions: [[1.00, 0.00], [0.75, 0.25], [0.50, 0.50], [0.25, 0.75], [0.00, 1.00]]
  chain_lengths_backbone: [80, 160]
  seeds: [1, 2, 3]
  total_backbone_carbons: 5120
  planned_downstream_density_scales: [0.95, 1.00, 1.05]
pilot:
  compositions: [[1.00, 0.00], [0.50, 0.50], [0.00, 1.00]]
  chain_lengths_backbone: [80]
  seeds: [1]
  total_backbone_carbons: 1280
  planned_downstream_density_scales: [0.95, 1.00, 1.05]
tiny:
  compositions: [[1.00, 0.00], [0.50, 0.50], [0.00, 1.00]]
  chain_lengths_backbone: [40]
  seeds: [1]
  total_backbone_carbons: 800
  planned_downstream_density_scales: [0.95, 1.00, 1.05]
density:
  definition: initial_packing_density_only
  initial_packing_density_g_cm3: 0.50
  not_equilibrium_density: true
conditions_for_later_mlff:
  target_temperature_K: 523.0
  target_pressure_atm: 1.0
tools:
  preferred_builder: emc
  known_emc_root: ~/software/EMC
  known_packmol_executable:
  known_lammps_executable:
  known_openbabel_executable:
builder:
  representation: emc_pcff_all_atom
  chain_conformation: emc_generated
  pp_tacticity: atactic_like_v0
  min_heavy_atom_distance_A: 1.8
  min_hydrogen_distance_A: 0.8
emc:
  enabled: true
  force_field: pcff
  require_all_atom_output: true
  attempt_timeout_seconds: 300
  build_timeout_seconds: 900
  preferred_force_fields: [PCFF]
  save_discovery_report: true
packmol:
  enabled: true
  tolerance_A: 2.0
  maxit: 2000
  filetype: pdb
  timeout_seconds: 300
