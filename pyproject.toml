[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pepp-initial-builder"
version = "0.1.0"
description = "PE/PP-silica data generation workflows for polymer, pore, MLFF seed, and CP2K/AIMD datasets"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "ase"]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
