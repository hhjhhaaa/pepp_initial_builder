[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pepp-initial-builder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "ase"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
